[package]
name = "printproof3d-plugins"
version = "0.6.2"
edition = "2021"
description = "Dynamic sandboxed WASM validation plugin system for PrintProof3D."
license = "MIT"

[dependencies]
printproof3d-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmi = "0.31.2"

[dev-dependencies]
wat = "1.0"
