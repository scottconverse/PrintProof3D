[package]
name = "example-plugin"
version = "0.6.1"
edition = "2021"
description = "Example dynamic WASM plugin for PrintProof3D."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
printproof3d-core = { path = "../core" }
printproof3d-plugins = { path = "../plugins" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
