[package]
name = "printproof3d-sdk"
version = "0.5.0-rc3"
edition = "2021"
description = "Developer SDK for PrintProof3D."
license = "MIT"

[dependencies]
printproof3d-core = { path = "../core" }
printproof3d-adapters = { path = "../adapters" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors"] }
tower = { version = "0.4", features = ["util"] }
tokio = { version = "1.35", features = ["sync", "time", "rt", "net", "macros"] }
md5 = "0.7"

[dev-dependencies]
tokio-tungstenite = "0.29.0"
futures-util = "0.3"
