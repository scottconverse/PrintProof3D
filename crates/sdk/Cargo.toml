[package]
name = "printproof3d-sdk"
version = "0.1.0"
edition = "2021"
description = "Developer SDK for PrintProof3D."

[dependencies]
printproof3d-core = { path = "../core" }
printproof3d-adapters = { path = "../adapters" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }

