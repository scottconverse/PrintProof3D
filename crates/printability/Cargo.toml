[package]
name = "printproof3d-printability"
version = "0.5.0"
edition = "2021"
description = "Printability engine for PrintProof3D."
license = "MIT"

[dependencies]
printproof3d-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
