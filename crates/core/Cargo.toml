[package]
name = "printproof3d-core"
version = "0.1.0"
edition = "2021"
description = "Core schemas and data models for PrintProof3D."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "0.8", features = ["chrono"] }
