[package]
name = "printproof3d"
version = "0.5.0-rc3"
edition = "2021"
description = "CLI tool for PrintProof3D."
license = "MIT"

[dependencies]
printproof3d-core = { path = "../core" }
printproof3d-printability = { path = "../printability" }
printproof3d-adapters = { path = "../adapters" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
printproof3d-plugins = { path = "../plugins" }
printproof3d-sdk = { path = "../sdk" }
tokio = { version = "1.35", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
