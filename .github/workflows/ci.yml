name: Rust CI

on:
  push:
    branches: [ main, "stage-*" ]
  pull_request:
    branches: [ main, "stage-*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Cargo Dependency Audit
      uses: rustsec/audit-action@v0.4.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Documentation Policy Scan
      run: python devtools/docs_policy_check.py

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev

    - name: Cache Cargo build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy linter
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build workspace
      run: cargo build --verbose

    - name: Run workspace tests
      run: cargo test --verbose

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright

    - name: Install Playwright browsers and system dependencies
      run: python -m playwright install --with-deps

    - name: Run Browser Acceptance Tests
      run: python -u devtools/acceptance_tests.py

