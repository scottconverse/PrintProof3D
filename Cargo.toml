[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/printability",
    "crates/adapters",
    "crates/sdk",
    "crates/cli",
    "crates/rest",
    "crates/plugins",
    "crates/example-plugin",
]

# The fuzz crate is a standalone workspace (nightly + sanitizer only); keep it out of the main
# workspace so stable `cargo build` / `cargo test --workspace` never touches it.
exclude = ["fuzz"]
